server {
    listen 80;
    root /usr/share/nginx/html;

    # Same job as the Vite dev proxy: the browser calls /api on this origin and
    # nginx forwards it to the back end ("backend" is its docker compose service name).
    location /api/ {
        proxy_pass http://backend:3000;
    }

    # Unknown paths fall back to index.html, so client-side routes survive a page reload.
    location / {
        try_files $uri /index.html;
    }
}
