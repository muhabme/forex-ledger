name: forexledger

services:
  mongo:
    image: mongo:8.0
    attach: false
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/forexledger
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: 1
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
